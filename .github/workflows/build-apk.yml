name: Build APK

# 只编管理器 APK。
#
# ## 为什么单独开一个
#
# 原来的 build-manager.yml 是个大 workflow，里面塞了六个 job：
#   generate-key / build-lkm / build-ksuinit / build-ksud / build-ksud-extra / build-manager
#
# 那些 kernel 和 userspace 的 job 是给**内核开发**用的（编 .ko、编 Rust 的 ksud 二进制、
# 编 RISC-V 的 ksuinit）。而 build-manager 其实只 needs generate-key —— 它压根不需要那些东西。
#
# 但它们没写触发条件，所以只要一推 manager 的代码，六个 job 全跑：
# 编译内核容器、交叉编译 Rust、打包一堆 .ko……每次十几分钟，全是白等。
#
# 这个 workflow 就是给"只改 UI"的场景用的：拿现成的 ksud 二进制（仓库里
# manager/app/src/main/jniLibs/arm64-v8a/libksud.so 已经有），直接编 APK。
#
# 需要内核那套的时候再手动跑原来的 build-manager.yml。

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'manager/**'
      - '.github/workflows/build-apk.yml'
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: '打个 tag 发 Release（留空就只出 artifact）'
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    # 发 Release 要写权限。不加的话 softprops/action-gh-release 会报
    # 403 Resource not accessible by integration。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: manager
        run: |
          # zip 往返会丢可执行位，保险起见再来一次
          # （仓库里已经是 0755 了，但本地 checkout 到某些文件系统上可能又变回去）
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nakour-style-manager-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 打了 tag（或者在 Actions 页面手动填了 tag）就顺手发一个 Release。
      #
      # 之前 Release 里一堆 ksud / lkm / ksuinit，是因为走了上游的 release.yml ——
      # 那个是内核发版用的。这里只放管理器 APK，一个文件，下起来不费劲。
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AsterUI ${{ inputs.tag || github.ref_name }}
          body: |
            管理器 APK（AsterUI 预览版）。

            debug 版，用 Android 默认调试签名，可以直接装。
          files: manager/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
